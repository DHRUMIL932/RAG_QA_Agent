<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG QA Agent — Document Q&amp;A</title>
    <meta name="description" content="AI-powered Document Question Answering agent with RAG retrieval, guardrails, and citations." />

    <!-- React 18 via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           CSS Design System — Dark Glassmorphism Theme
           ================================================================ */
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.6);
            --bg-glass: rgba(255, 255, 255, 0.04);
            --bg-glass-hover: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(99, 102, 241, 0.4);

            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --accent-primary: #6366f1;
            --accent-primary-light: #818cf8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
            --accent-glow: rgba(99, 102, 241, 0.25);

            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.1);
            --info: #3b82f6;
            --info-bg: rgba(59, 130, 246, 0.1);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;

            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px var(--accent-glow);

            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background animated gradient orbs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 600px;
            height: 600px;
            background: var(--accent-primary);
            top: -200px;
            right: -150px;
            animation: float1 20s ease-in-out infinite;
        }
        body::after {
            width: 500px;
            height: 500px;
            background: #8b5cf6;
            bottom: -150px;
            left: -100px;
            animation: float2 25s ease-in-out infinite;
        }
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-80px, 80px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(60px, -60px); }
        }

        #root {
            position: relative;
            z-index: 1;
        }

        /* ---- Layout ---- */
        .app-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* ---- Header ---- */
        .header {
            text-align: center;
            padding: 48px 0 32px;
        }
        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent-primary-light);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .header-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .header h1 {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -1.2px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ---- Status cards row ---- */
        .status-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }
        .status-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            transition: var(--transition-base);
        }
        .status-card:hover {
            background: var(--bg-glass-hover);
            border-color: var(--border-accent);
        }
        .status-card .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .status-card .value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.green { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.red { background: var(--error); box-shadow: 0 0 8px var(--error); }
        .status-dot.yellow { background: var(--warning); box-shadow: 0 0 8px var(--warning); }

        /* ---- Main Chat area ---- */
        .chat-wrapper {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-glass);
        }
        .chat-header-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .chat-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Toggle & select */
        .toggle-group {
            display: flex;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glass);
            overflow: hidden;
        }
        .toggle-btn {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            background: transparent;
            transition: var(--transition-fast);
        }
        .toggle-btn.active {
            background: var(--accent-primary);
            color: white;
        }
        .toggle-btn:hover:not(.active) {
            color: var(--text-primary);
        }

        .select-k {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-primary);
            cursor: pointer;
            outline: none;
            transition: var(--transition-fast);
        }
        .select-k:focus {
            border-color: var(--accent-primary);
        }
        .select-k option { background: var(--bg-secondary); }

        .guardrail-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }
        .guardrail-toggle input {
            display: none;
        }
        .switch-track {
            width: 36px;
            height: 20px;
            border-radius: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            position: relative;
            transition: var(--transition-fast);
        }
        .switch-track::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: var(--transition-fast);
        }
        .guardrail-toggle input:checked + .switch-track {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        .guardrail-toggle input:checked + .switch-track::after {
            transform: translateX(16px);
            background: white;
        }

        /* Messages area */
        .messages-area {
            min-height: 380px;
            max-height: 520px;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }
        .messages-area::-webkit-scrollbar {
            width: 6px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: var(--border-glass);
            border-radius: 3px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            text-align: center;
        }
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }
        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .empty-state p {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 340px;
            line-height: 1.5;
        }
        .sample-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
            justify-content: center;
        }
        .sample-q {
            padding: 7px 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            font-size: 12px;
            font-family: inherit;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-fast);
        }
        .sample-q:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary-light);
            background: var(--bg-glass-hover);
        }

        /* Message bubbles */
        .message {
            margin-bottom: 20px;
            animation: fadeSlideIn 0.3s ease-out;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }
        .msg-label.user { color: var(--accent-primary-light); }
        .msg-label.agent { color: var(--success); }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.65;
        }
        .msg-bubble.user {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            color: var(--text-primary);
        }
        .msg-bubble.agent {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
        }
        .msg-bubble.blocked {
            background: var(--error-bg);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
        }

        /* Citations */
        .citations {
            margin-top: 10px;
        }
        .citations-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .citation-item {
            padding: 8px 12px;
            background: rgba(59, 130, 246, 0.06);
            border-left: 3px solid var(--info);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .citation-tag {
            font-weight: 600;
            color: var(--info);
        }

        /* Meta info under answer */
        .meta-info {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .meta-info span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ---- Input area ---- */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border-glass);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-area textarea {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-primary);
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            transition: var(--transition-fast);
            line-height: 1.5;
        }
        .input-area textarea::placeholder {
            color: var(--text-muted);
        }
        .input-area textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            border: none;
            background: var(--accent-gradient);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: var(--shadow-glow);
        }
        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Loading animation */
        .loading-dots {
            display: flex;
            gap: 6px;
            padding: 8px 0;
        }
        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-primary-light);
            animation: loadBounce 1.2s ease-in-out infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes loadBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ---- Documents panel ---- */
        .docs-panel {
            margin-top: 24px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .docs-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-glass);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .docs-list {
            padding: 12px 20px;
        }
        .doc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-glass);
        }
        .doc-item:last-child { border-bottom: none; }
        .doc-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .doc-ext {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-primary-light);
        }
        .doc-size {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ---- Footer ---- */
        .footer {
            text-align: center;
            padding: 32px 0 16px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .footer a {
            color: var(--accent-primary-light);
            text-decoration: none;
        }

        /* ---- Responsive ---- */
        @media (max-width: 640px) {
            .header h1 { font-size: 28px; }
            .status-row { grid-template-columns: 1fr 1fr; }
            .chat-header { flex-direction: column; gap: 10px; align-items: flex-start; }
            .chat-controls { flex-wrap: wrap; }
            .sample-questions { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // -------------------------------------------------------------------
        // API helpers
        // -------------------------------------------------------------------
        const API = ""; // same origin

        async function fetchHealth() {
            const res = await fetch(`${API}/api/health`);
            return res.json();
        }
        async function fetchConfig() {
            const res = await fetch(`${API}/api/config`);
            return res.json();
        }
        async function fetchDocuments() {
            const res = await fetch(`${API}/api/documents`);
            return res.json();
        }
        async function askQuestion(question, store, k, guardrails) {
            const endpoint = guardrails ? "/api/ask-guardrailed" : "/api/ask";
            const res = await fetch(`${API}${endpoint}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question, store, k }),
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.detail || `HTTP ${res.status}`);
            }
            return res.json();
        }

        // -------------------------------------------------------------------
        // Components
        // -------------------------------------------------------------------

        function StatusCard({ label, value, dotColor }) {
            return (
                <div className="status-card">
                    <div className="label">{label}</div>
                    <div className="value">
                        {dotColor && <span className={`status-dot ${dotColor}`} />}
                        {value}
                    </div>
                </div>
            );
        }

        function MessageBubble({ msg }) {
            const isBlocked = msg.answer && msg.answer.startsWith("BLOCKED");
            return (
                <div className="message">
                    {msg.role === "user" ? (
                        <>
                            <div className="msg-label user">⟩ You</div>
                            <div className="msg-bubble user">{msg.text}</div>
                        </>
                    ) : (
                        <>
                            <div className="msg-label agent">⟩ Agent</div>
                            <div className={`msg-bubble agent ${isBlocked ? 'blocked' : ''}`}>
                                {msg.answer}
                            </div>
                            {msg.citations && msg.citations.length > 0 && (
                                <div className="citations">
                                    <div className="citations-title">📎 Source Citations</div>
                                    {msg.citations.map((c, i) => (
                                        <div key={i} className="citation-item">
                                            <span className="citation-tag">{c.tag}</span>
                                            {" — "}{c.snippet}…
                                        </div>
                                    ))}
                                </div>
                            )}
                            <div className="meta-info">
                                <span>⚡ {msg.query_time_ms}ms</span>
                                <span>📦 {msg.store_used}</span>
                                <span>🧩 {msg.chunks_retrieved} chunks</span>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        function LoadingIndicator() {
            return (
                <div className="message">
                    <div className="msg-label agent">⟩ Agent</div>
                    <div className="msg-bubble agent">
                        <div className="loading-dots">
                            <span /><span /><span />
                        </div>
                    </div>
                </div>
            );
        }

        function DocumentsPanel({ docs }) {
            if (!docs || docs.length === 0) return null;
            const formatSize = (bytes) => {
                if (bytes < 1024) return `${bytes} B`;
                return `${(bytes / 1024).toFixed(1)} KB`;
            };
            return (
                <div className="docs-panel">
                    <div className="docs-header">
                        <span>📁 Indexed Documents</span>
                        <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{docs.length} file{docs.length !== 1 ? 's' : ''}</span>
                    </div>
                    <div className="docs-list">
                        {docs.map((doc, i) => (
                            <div key={i} className="doc-item">
                                <div className="doc-name">
                                    <span className="doc-ext">{doc.extension.replace('.', '')}</span>
                                    {doc.name}
                                </div>
                                <div className="doc-size">{formatSize(doc.size_bytes)}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // -------------------------------------------------------------------
        // Main App
        // -------------------------------------------------------------------

        function App() {
            const [health, setHealth] = useState(null);
            const [agentConfig, setAgentConfig] = useState(null);
            const [documents, setDocuments] = useState([]);
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [store, setStore] = useState("faiss");
            const [k, setK] = useState(3);
            const [guardrails, setGuardrails] = useState(false);
            const messagesEndRef = useRef(null);
            const textareaRef = useRef(null);

            useEffect(() => {
                fetchHealth().then(setHealth).catch(() => setHealth({ status: "error" }));
                fetchConfig().then(setAgentConfig).catch(() => {});
                fetchDocuments().then(d => setDocuments(d.documents || [])).catch(() => {});
            }, []);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, loading]);

            const handleSend = useCallback(async (overrideText) => {
                const q = (overrideText || input).trim();
                if (!q || loading) return;

                setMessages(prev => [...prev, { role: "user", text: q }]);
                setInput("");
                setLoading(true);

                try {
                    const result = await askQuestion(q, store, k, guardrails);
                    setMessages(prev => [...prev, { role: "agent", ...result }]);
                } catch (err) {
                    setMessages(prev => [...prev, {
                        role: "agent",
                        answer: `Error: ${err.message}`,
                        citations: [],
                        query_time_ms: 0,
                        store_used: store,
                        chunks_retrieved: 0,
                    }]);
                } finally {
                    setLoading(false);
                }
            }, [input, store, k, guardrails, loading]);

            const handleKeyDown = (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            };

            const sampleQuestions = [
                "What is Nimbus's refund policy?",
                "What products does Nimbus offer?",
                "How does Nimbus handle security?",
            ];

            return (
                <div className="app-container">
                    {/* Header */}
                    <header className="header">
                        <div className="header-badge">
                            <span className="dot" />
                            Practical 9 — Deployed AI Agent
                        </div>
                        <h1>RAG QA Agent</h1>
                        <p>Ask questions about your documents. Powered by retrieval-augmented generation with FastAPI &amp; React.</p>
                    </header>

                    {/* Status row */}
                    <div className="status-row">
                        <StatusCard
                            label="System"
                            value={health?.status === "ok" ? "Online" : "Connecting…"}
                            dotColor={health?.status === "ok" ? "green" : "yellow"}
                        />
                        <StatusCard
                            label="Vector Store"
                            value={store === "faiss"
                                ? (health?.faiss_ready ? "FAISS ✓" : "FAISS ✗")
                                : (health?.chroma_ready ? "Chroma ✓" : "Chroma ✗")}
                            dotColor={
                                (store === "faiss" ? health?.faiss_ready : health?.chroma_ready)
                                    ? "green" : "red"
                            }
                        />
                        <StatusCard
                            label="LLM Model"
                            value={agentConfig?.llm_model || "Loading…"}
                            dotColor={health?.groq_configured ? "green" : "red"}
                        />
                        <StatusCard
                            label="Guardrails"
                            value={guardrails ? "Enabled" : "Disabled"}
                            dotColor={guardrails ? "green" : "yellow"}
                        />
                    </div>

                    {/* Chat area */}
                    <div className="chat-wrapper">
                        <div className="chat-header">
                            <div className="chat-header-title">💬 Conversation</div>
                            <div className="chat-controls">
                                {/* Store toggle */}
                                <div className="toggle-group">
                                    <button
                                        className={`toggle-btn ${store === 'faiss' ? 'active' : ''}`}
                                        onClick={() => setStore('faiss')}
                                    >FAISS</button>
                                    <button
                                        className={`toggle-btn ${store === 'chroma' ? 'active' : ''}`}
                                        onClick={() => setStore('chroma')}
                                    >Chroma</button>
                                </div>

                                {/* K select */}
                                <select
                                    className="select-k"
                                    value={k}
                                    onChange={e => setK(Number(e.target.value))}
                                >
                                    {[1,2,3,4,5,7,10].map(v => (
                                        <option key={v} value={v}>k={v}</option>
                                    ))}
                                </select>

                                {/* Guardrails toggle */}
                                <label className="guardrail-toggle">
                                    <input
                                        type="checkbox"
                                        checked={guardrails}
                                        onChange={e => setGuardrails(e.target.checked)}
                                    />
                                    <span className="switch-track" />
                                    Guardrails
                                </label>
                            </div>
                        </div>

                        <div className="messages-area">
                            {messages.length === 0 && !loading ? (
                                <div className="empty-state">
                                    <div className="empty-icon">🔍</div>
                                    <h3>Ask anything about your documents</h3>
                                    <p>The agent retrieves relevant chunks and answers using only the indexed context.</p>
                                    <div className="sample-questions">
                                        {sampleQuestions.map((q, i) => (
                                            <button
                                                key={i}
                                                className="sample-q"
                                                onClick={() => handleSend(q)}
                                            >{q}</button>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <>
                                    {messages.map((msg, i) => (
                                        <MessageBubble key={i} msg={msg} />
                                    ))}
                                    {loading && <LoadingIndicator />}
                                </>
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        <div className="input-area">
                            <textarea
                                ref={textareaRef}
                                value={input}
                                onChange={e => setInput(e.target.value)}
                                onKeyDown={handleKeyDown}
                                placeholder="Type your question here… (Enter to send, Shift+Enter for new line)"
                                rows={1}
                                disabled={loading}
                            />
                            <button
                                className="send-btn"
                                onClick={() => handleSend()}
                                disabled={loading || !input.trim()}
                                title="Send"
                            >➤</button>
                        </div>
                    </div>

                    {/* Documents panel */}
                    <DocumentsPanel docs={documents} />

                    {/* Footer */}
                    <footer className="footer">
                        AAI Practical 9 — RAG QA Agent deployed with FastAPI + React &nbsp;|&nbsp;
                        <a href="/docs" target="_blank" rel="noopener">Swagger API Docs ↗</a>
                    </footer>
                </div>
            );
        }

        // -------------------------------------------------------------------
        // Mount
        // -------------------------------------------------------------------
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
